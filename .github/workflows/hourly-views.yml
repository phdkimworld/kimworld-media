name: Hourly channel views
# 매시 채널 공개 영상 전체의 누적 조회수 합계를 hourly_views.jsonl에 한 줄씩 쌓는다(요일·시각별 핫스팟 계산용).
# Analytics 토큰(secrets.YT_ANALYTICS_REFRESH_TOKEN)이 있으면 하루 한 번(UTC 11시대) analytics/latest.json도 갱신한다.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: hourly-views
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot views
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/yt_hourly.py
      - name: Daily analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YT_ANALYTICS_REFRESH_TOKEN }}
          YT_ANALYTICS_CLIENT_ID: ${{ secrets.YT_ANALYTICS_CLIENT_ID }}
          YT_ANALYTICS_CLIENT_SECRET: ${{ secrets.YT_ANALYTICS_CLIENT_SECRET }}
        run: |
          if [ "$(date -u +%H)" = "11" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "$YT_ANALYTICS_REFRESH_TOKEN" ] && python tools/yt_analytics.py || echo "analytics token 없음 또는 범위 부족 - 건너뜀"
          fi
      - name: Commit
        run: |
          git config user.name "kimworld-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hourly_views.jsonl analytics 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "hourly views $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
