<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#05020a;font-family:'Noto Sans CJK KR','Noto Sans CJK JP',sans-serif}
.t{position:absolute;font-weight:900;line-height:1}
</style></head><body>
<svg width="1280" height="720" style="position:absolute;left:0;top:0">
<defs>
 <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6ff"/><stop offset="0.5" stop-color="#d79bff"/><stop offset="1" stop-color="#8a2cff"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79bff" stop-opacity="0.75"/><stop offset="1" stop-color="#d79bff" stop-opacity="0"/></linearGradient>
 <radialGradient id="flo" cx="0.5" cy="0" r="0.8"><stop offset="0" stop-color="#ff8a1a" stop-opacity="0.7"/><stop offset="1" stop-color="#ff8a1a" stop-opacity="0"/></radialGradient>
 <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1280" height="720" fill="#05020a"/>
<!-- floor -->
<polygon points="0,520 1280,520 1280,720 0,720" fill="#120720"/>
<ellipse cx="900" cy="560" rx="420" ry="70" fill="url(#flo)"/>
<!-- light spilling from door onto floor -->
<polygon points="830,515 970,515 1240,720 560,720" fill="url(#beam)" opacity="0.8"/>
<!-- door frame -->
<rect x="815" y="90" width="170" height="430" fill="#d79bff" filter="url(#gl)" opacity="0.9"/>
<rect x="830" y="105" width="140" height="415" fill="url(#door)"/>
<rect x="800" y="80" width="200" height="445" fill="none" stroke="#2a1040" stroke-width="18"/>
<!-- broken chart behind: crash then rebound on left wall -->
<polyline points="1050,120 1100,135 1140,230 1170,300 1200,410 1225,470 1240,330 1262,250" fill="none" stroke="#ff4d6d" stroke-width="7" opacity="0.9"/>
<polyline points="1225,470 1240,330 1262,250" fill="none" stroke="#3dffb0" stroke-width="9"/>
<!-- orange coin steps leading to door -->
<g>
 <ellipse cx="700" cy="610" rx="90" ry="22" fill="#b85a00"/><ellipse cx="700" cy="602" rx="90" ry="22" fill="#ffae3a"/>
 <ellipse cx="760" cy="572" rx="76" ry="18" fill="#b85a00"/><ellipse cx="760" cy="565" rx="76" ry="18" fill="#ffbf5a"/>
 <ellipse cx="815" cy="540" rx="62" ry="15" fill="#b85a00"/><ellipse cx="815" cy="534" rx="62" ry="15" fill="#ffd27a"/>
</g>
</svg>
<div class="t" style="left:48px;top:44px;font-size:40px;color:#ffd27a;border:4px solid #ffd27a;padding:8px 16px;border-radius:10px">스택스 STX</div>
<div class="t" style="left:48px;top:150px;font-size:60px;color:#ff6b84;text-shadow:0 4px 0 #3a0010">-97% 바닥에서</div>
<div class="t" style="left:44px;top:250px;font-size:132px;color:#fff;letter-spacing:-4px;text-shadow:0 7px 0 #3a0a6a,0 0 40px rgba(200,120,255,.7)">창업자가</div>
<div class="t" style="left:44px;top:398px;font-size:132px;color:#e2b0ff;letter-spacing:-4px;text-shadow:0 7px 0 #2a0050">돌아왔다</div>
<div class="t" style="left:48px;top:590px;font-size:46px;color:#3dffb0">하루 +17%</div>
</body></html>
