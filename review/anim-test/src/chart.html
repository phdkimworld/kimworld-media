<!doctype html><html><head><meta charset="utf-8">
<!-- 시험 장면 1: 움직이는 가격선(GSAP 타임라인 + SVG). 숫자는 content/reports/plug-2026-11-3.md 에서만 가져옴.
     계약: window.scene = {dur, ready, seek(t)} — 렌더러가 t초로 넘기고 캡처한다(실시간 재생 안 함) -->
<script src="../lib/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B1524;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;color:#E6EDF5;word-break:keep-all}
.bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 85% 15%,rgba(79,163,255,.16),transparent 70%),radial-gradient(800px 600px at 10% 95%,rgba(245,184,61,.10),transparent 70%),#0B1524}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}
.hdr{position:absolute;left:96px;right:96px;top:52px;display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700}
.brand{color:#F5B83D}.tk{padding:4px 16px;border:2px solid #F5B83D;border-radius:10px;color:#F5B83D;font-weight:900}
.kick{margin-left:auto;padding:8px 22px;border-radius:999px;background:rgba(245,184,61,.14);color:#F5B83D;font-weight:900}
h1{position:absolute;left:96px;top:130px;font-weight:900;font-size:60px;color:#fff;letter-spacing:-1px}
svg{position:absolute;left:0;top:0}
.panel{position:absolute;left:1515px;top:300px;width:365px;padding:34px 26px;border-radius:28px;background:rgba(22,37,59,.92);border:2px solid #22385A}
.panel .lab{font-size:32px;font-weight:700;color:#9FB3CC}
.panel .big{font-size:88px;font-weight:900;letter-spacing:-3px;color:#fff;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.panel .big small{font-size:46px;letter-spacing:0;margin-left:4px}
.panel .pct{font-size:64px;font-weight:900;color:#FF4D5E;margin-top:18px;font-variant-numeric:tabular-nums}
.panel .note{font-size:28px;color:#9FB3CC;margin-top:4px}
.ftr{position:absolute;left:96px;bottom:40px;font-size:22px;color:#6F829B}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="hdr"><span class="brand">김박사 월드</span><span class="tk">PLUG</span><span>플러그 파워</span><span class="kick">실적 뒤 4거래일</span></div>
<h1 id="ttl">공시 없이 4거래일, 종가는 이렇게 내려왔다</h1>
<svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4D5E" stop-opacity=".28"/><stop offset="1" stop-color="#FF4D5E" stop-opacity="0"/></linearGradient>
  <clipPath id="reveal"><rect id="revealRect" x="0" y="0" width="0" height="1080"/></clipPath></defs>
  <g id="axes"></g>
  <g id="base"><line id="baseLine" x1="300" x2="1460" y1="425" y2="425" stroke="#F5B83D" stroke-width="3" stroke-dasharray="14 12" opacity=".8"/>
    <text id="baseTxt" x="1030" y="407" font-size="30" font-weight="700" fill="#F5B83D">실적 전 종가 1.50달러</text></g>
  <path id="area" fill="url(#fill)" clip-path="url(#reveal)"/>
  <path id="line" fill="none" stroke="#FF4D5E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle id="head" r="16" fill="#FF4D5E" filter="url(#glow)"/>
  <g id="dots"></g>
  <g id="brk" opacity="0"><path id="brkPath" fill="none" stroke="#4FA3FF" stroke-width="5" stroke-linecap="round"/>
    <text id="brkTxt" x="1025" y="300" text-anchor="middle" font-size="40" font-weight="900" fill="#4FA3FF">11.10 ~ 11.13 · SEC 공시 0건</text></g>
</svg>
<div class="panel" id="panel"><div class="lab" id="plab">11.09 종가</div><div class="big"><span id="pv">1.50</span><small>달러</small></div>
  <div class="pct" id="pp">0.0%</div><div class="note">실적 전 종가 대비</div></div>
<div class="ftr">자료: 나스닥 일별 종가 · SEC EDGAR · drkimworld.com 리포트(11월 13일 기준)</div>
<script>
const D=[['11.09',1.50,'3분기 실적 발표','장 마감 뒤'],['11.10',1.365,'첫날 -9.0%',''],['11.11',1.355,'-0.7%',''],['11.12',1.235,'-8.9%',''],['11.13',1.11,'-10.1%','']];
const X=i=>300+i*290, Y=v=>880-(v-1.08)/0.44*500;
const NS='http://www.w3.org/2000/svg', el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e};
const sv=document.getElementById('sv'), ax=document.getElementById('axes'), dots=document.getElementById('dots');
// 축: 가격 눈금 + 날짜
[1.1,1.2,1.3,1.4,1.5].forEach(v=>{el('line',{x1:250,x2:1480,y1:Y(v),y2:Y(v),stroke:'#22385A','stroke-width':2},ax);const t=el('text',{x:236,y:Y(v)+11,'text-anchor':'end','font-size':30,fill:'#6F829B','font-weight':700},ax);t.textContent=v.toFixed(2)});
D.forEach((d,i)=>{const t=el('text',{x:X(i),y:950,'text-anchor':'middle','font-size':38,'font-weight':900,fill:i==4?'#fff':'#9FB3CC'},ax);t.textContent=d[0]});
{const bl=document.getElementById('baseLine');bl.setAttribute('y1',Y(1.5));bl.setAttribute('y2',Y(1.5));document.getElementById('baseTxt').setAttribute('y',Y(1.5)-18);}
const pts=D.map((d,i)=>[X(i),Y(d[1])]);
const line=document.getElementById('line'); line.setAttribute('d','M'+pts.map(p=>p.join(',')).join(' L'));
document.getElementById('area').setAttribute('d','M'+pts.map(p=>p.join(',')).join(' L')+` L${X(4)},880 L${X(0)},880 Z`);
const L=line.getTotalLength(); line.style.strokeDasharray=L; line.style.strokeDashoffset=L;
// 각 점의 길이 비율
let acc=[0];for(let i=1;i<pts.length;i++)acc.push(acc[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const FR=acc.map(a=>a/acc[acc.length-1]);
// 사건 점과 이름표
const G=D.map((d,i)=>{const g=el('g',{opacity:0},dots);const [x,y]=pts[i];
  el('circle',{cx:x,cy:y,r:30,fill:i==0?'#F5B83D':'#FF4D5E',opacity:.25},g);el('circle',{cx:x,cy:y,r:14,fill:i==0?'#F5B83D':'#FF4D5E',stroke:'#0B1524','stroke-width':5},g);
  const up=i==0, ty=up?y-48:y+70, side=i==4; const t=el('text',{x:i==0?x-20:(side?x+34:x),y:side?y+14:ty,'text-anchor':(i==0||side)?'start':'middle','font-size':i==0?36:40,'font-weight':900,fill:i==0?'#F5B83D':'#fff'},g);t.textContent=d[2];
  if(d[3]){const s=el('text',{x:x-20,y:ty+40,'font-size':28,'font-weight':700,fill:'#9FB3CC'},g);s.textContent=d[3];if(up){t.setAttribute('y',y-90);s.setAttribute('y',y-50)}}
  return g});
// 공시 0건 괄호(11.10~11.13 위)
const bx0=X(1),bx1=X(4),by=330; document.getElementById('brkPath').setAttribute('d',`M${bx0},${by+30} L${bx0},${by} L${bx1},${by} L${bx1},${by+30}`);
const bp=document.getElementById('brkPath'), BL=bp.getTotalLength(); bp.style.strokeDasharray=BL; bp.style.strokeDashoffset=BL;

const S={p:0}; // 선 진행률(0~1)
const C={v:1.50,k:0}; // 패널 숫자: 점이 뜰 때마다 그 날 실제 종가로 굴러간다(사이 값은 0.35초 동안만)
const tl=gsap.timeline({paused:true});
// 첫 프레임부터 제목·축·패널이 보이게 둔다(video_check '빈 화면'·'정지' 판정이 컷을 잡도록 — 시험에서 확인)
tl.to(G[0],{opacity:1,duration:.35},0.5).from(G[0].querySelectorAll('circle'),{attr:{r:0},duration:.45,ease:'back.out(2.5)'},0.5)
  .from('#baseLine',{attr:{x2:300},duration:.6,ease:'power2.out'},0.8).from('#baseTxt',{opacity:0,duration:.4},1.1)
;
const T0=1.4,T1=5.6; // 선 그리기 구간
tl.to(S,{p:1,duration:T1-T0,ease:'none'},T0);
for(let i=1;i<5;i++){const at=T0+FR[i]*(T1-T0);tl.to(G[i],{opacity:1,duration:.2},at).from(G[i].querySelectorAll('circle'),{attr:{r:0},duration:.45,ease:'back.out(2.5)'},at).from(G[i].querySelectorAll('text'),{opacity:0,y:12,duration:.35},at+.05);
  if(i<4)tl.set(C,{v:D[i][1],k:i},at).fromTo('#pv',{color:'#FF4D5E'},{color:'#ffffff',duration:.5,immediateRender:false},at); else tl.set(C,{k:4},at).to(C,{v:1.11,duration:.9,ease:'power2.out'},at)}
tl.to('#brk',{opacity:1,duration:.3},5.9).to(bp,{strokeDashoffset:0,duration:.7,ease:'power2.inOut'},5.9).from('#brkTxt',{opacity:0,y:20,duration:.5},6.3)
  .to('#panel',{borderColor:'#FF4D5E',boxShadow:'0 0 0 6px rgba(255,77,94,.25),0 20px 60px rgba(0,0,0,.45)',duration:.4},6.4)
  .fromTo('#pv',{scale:1},{scale:1.12,duration:.25,yoyo:true,repeat:1,transformOrigin:'0% 50%'},6.5)
  .to({},{duration:.01},9.0);
const pv=document.getElementById('pv'),pp=document.getElementById('pp'),plab=document.getElementById('plab'),head=document.getElementById('head'),rr=document.getElementById('revealRect');
function draw(){const p=S.p; line.style.strokeDashoffset=L*(1-p); const pt=line.getPointAtLength(L*p);
  head.setAttribute('cx',pt.x);head.setAttribute('cy',pt.y);head.setAttribute('opacity',p>0&&p<1?1:(p>=1?.0:0));rr.setAttribute('width',pt.x);
  const k=Math.round(C.k), done=Math.abs(C.v-D[k][1])<1e-9, fmt=v=>v.toFixed(3).replace(/0$/,'');
  pv.textContent=done?fmt(D[k][1]):C.v.toFixed(2); plab.textContent=D[k][0]+' 종가';
  pp.textContent=(done&&k==0)?'0.0%':((C.v/1.50-1)*100).toFixed(1)+'%';}
window.scene={dur:9.0,ready:document.fonts.ready,seek(t){tl.seek(Math.min(t,tl.duration()),false);draw();}};
scene.seek(0);
</script></body></html>
